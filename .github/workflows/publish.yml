# Keep this filename: npm trusted publishing (OIDC) is registered for publish.yml.
name: CI and publish

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs on branches are cancelled. Never on main, so a publish isn't cut off.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # see every platform's result, not just the first failure
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["24", "26"] # "current" resolves to alpha builds; bump to the newest stable major
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false # no caching in release builds (cache poisoning)
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
        env:
          # Windows runners have Credential Manager; Linux gets its own keychain job below.
          ARCA_TEST_OS_KEYCHAIN: ${{ runner.os == 'Windows' && '1' || '' }}
      - name: Build
        run: npm run build
      - name: Smoke test (packed package in a temp project)
        run: npm run smoke

  # The real Secret Service: a D-Bus session with an unlocked gnome-keyring.
  keychain-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false # no caching in release builds (cache poisoning)
      - name: Install dependencies
        run: npm ci
      - name: Install gnome-keyring
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dbus gnome-keyring
      - name: Keychain tests against the Secret Service
        run: |
          dbus-run-session -- sh -c '
            echo -n ci-keyring-pw | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            ARCA_TEST_OS_KEYCHAIN=1 npx vitest run test/keychain.test.ts test/backend.test.ts
          '

  # A version bump on main is the release gate. Runs only when every test job passed.
  publish:
    needs: [test, keychain-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC, allows GitHub Actions to generate OIDC tokens
      contents: read
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # no caching in release builds (cache poisoning)

      - name: Check if version is already published
        id: version-check
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Package: $PACKAGE_NAME@$PACKAGE_VERSION"

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION is already published, skipping publish"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $PACKAGE_VERSION is not published yet"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

        # Trusted publishing (OIDC) needs npm 11.5.1 or later
      - name: Update npm
        if: steps.version-check.outputs.should_publish == 'true'
        run: npm install -g npm@latest
      - name: Install dependencies
        if: steps.version-check.outputs.should_publish == 'true'
        run: npm ci
      - name: Build
        if: steps.version-check.outputs.should_publish == 'true'
        run: npm run build
      - name: Publish to npm
        if: steps.version-check.outputs.should_publish == 'true'
        run: npm publish --access public
