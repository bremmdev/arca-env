# Layer 5: the packed package in real Next.js and TanStack Start dev servers, read by headless
# Chrome. Slow and exposed to framework releases, so it never blocks a push or a publish: it runs
# daily, when package.json changes on main (version bumps), and by hand.
name: Framework checks

on:
  schedule:
    - cron: "23 4 * * *" # daily, 04:23 UTC
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frameworks:
    name: frameworks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] # both have Google Chrome installed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Next.js and TanStack Start checks
        run: npm run frameworks
